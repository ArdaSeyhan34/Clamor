[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clamor"
version = "0.1.0"
description = "Turn the noise of customer feedback into a revenue-weighted, statistically honest product roadmap."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taha Arda Seyhan" }]
keywords = ["product-management", "nlp", "customer-feedback", "clustering", "analytics", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "typer>=0.9",
    "jinja2>=3.1",
    "plotly>=5.18",
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
app = ["streamlit>=1.45"]
llm = ["anthropic>=1.0"]
dev = ["pytest>=7.4", "ruff>=0.5"]
all = ["clamor[app,llm,dev]"]

[project.scripts]
clamor = "clamor.cli:app"

[project.urls]
Repository = "https://github.com/ArdaSeyhan34/clamor"

[tool.setuptools.packages.find]
include = ["clamor*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
