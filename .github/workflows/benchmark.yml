name: Benchmark

# Measures theme discovery and alerting against the ground truth of a demo scenario and,
# optionally, grid-searches the clustering thresholds. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Demo scenario (tempo or lezzo)"
        default: "lezzo"
      grid:
        description: "Grid-search the clustering thresholds (10-20 minutes)"
        type: boolean
        default: true
      backend:
        description: "Embedding backend to tune (empty: the scenario language's default)"
        default: ""
      tune_args:
        description: "Extra arguments for scripts/tune.py, e.g. --distances 0.6,0.7"
        default: ""
      bundle:
        description: "Also attach the report as a base64 tar.gz annotation (API access only)"
        type: boolean
        default: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      SCENARIO: ${{ inputs.scenario }}
      BACKEND: ${{ inputs.backend }}
      TUNE_ARGS: ${{ inputs.tune_args }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/clamor
          key: onnx-models-${{ inputs.scenario }}-v1
      - run: pip install -e .
      - name: Grid search
        if: inputs.grid
        shell: bash  # -eo pipefail: a failing tune.py fails the step despite the tee
        run: |
          python scripts/tune.py --scenario "$SCENARIO" ${BACKEND:+--backend "$BACKEND"} $TUNE_ARGS \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Demo report
        run: |
          clamor demo --scenario "$SCENARIO" ${BACKEND:+--backend "$BACKEND"} --no-llm --out report
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
          (cd report && sha256sum report.md roadmap.csv briefs/*.md)
      - name: Report bundle
        # the check-run annotations API returns these inline, for clients that can reach
        # api.github.com but not the artifact storage (annotations hold up to 4 KB each)
        if: inputs.bundle
        run: |
          tar czf bundle.tgz -C report report.md roadmap.csv briefs
          base64 -w 4000 bundle.tgz > chunks.txt
          n=$(wc -l < chunks.txt); i=0
          while read -r chunk; do
            i=$((i + 1)); echo "::notice title=report bundle $i/$n::$chunk"
          done < chunks.txt
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.scenario }}
          path: report
