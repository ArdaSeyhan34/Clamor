name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,llm]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        # tests use the TF-IDF backend and a fake Claude client: no downloads, no API key
        run: pytest

  demo:
    # end-to-end run with the real embedding model, checks the published accuracy still holds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: tempo  # English, MiniLM
            metric: ARI
            minimum: 0.7
          - scenario: lezzo  # Turkish, multilingual MiniLM + TF-IDF (splits rather than merges)
            metric: homogeneity
            minimum: 0.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/clamor
          key: onnx-models-${{ matrix.scenario }}-v1
      - run: pip install -e .
      - run: clamor demo --scenario ${{ matrix.scenario }} --no-llm --out /tmp/demo 2>&1 | tee demo.log
      - name: Accuracy guard
        env:
          METRIC: ${{ matrix.metric }}
          MINIMUM: ${{ matrix.minimum }}
        run: |
          python - <<'PY'
          import os, re
          log = open("demo.log").read()
          assert "falling back" not in log, "the embedding model could not be loaded"
          metric, minimum = os.environ["METRIC"], float(os.environ["MINIMUM"])
          value = float(re.search(rf"{metric} ([0-9.]+)", log).group(1))
          assert value > minimum, f"theme discovery regressed: {metric} {value}"
          print(metric, value)
          PY
